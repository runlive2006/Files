name: build

# 触发条件：
# - 推送到 main
# - 针对 main 的 PR
# - 手动触发（便于随时验证）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限：本工作流只读仓库内容
permissions:
  contents: read

# 同一分支的旧运行自动取消，避免排队浪费
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与测试
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # global.json 要求 10.0.100，允许向上滚动到最新功能带
          dotnet-version: '10.0.x'

      - name: 显示 SDK 信息
        shell: pwsh
        run: |
          dotnet --version
          dotnet --list-sdks

      # 依赖缓存固定在仓库内的 .dotnet/packages（见 NuGet.config），
      # 因此可以直接缓存这个目录，命中后省掉全部 NuGet 下载。
      - name: 缓存 NuGet 依赖
        uses: actions/cache@v4
        with:
          path: .dotnet/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('NuGet.config', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # 直接调用用户使用的构建脚本：
      # 这样 CI 验证的就是真实交付路径，避免"CI 能过、用户构建失败"。
      - name: 构建（含单元测试）
        shell: pwsh
        run: ./scripts/build.ps1

      - name: 检查产物
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path artifacts -Filter 'Files.exe' -Recurse |
            Select-Object -First 1

          if ($null -eq $exe) {
            Write-Error '未找到构建产物 Files.exe'
            exit 1
          }

          $dir = $exe.Directory
          $totalMb = [Math]::Round(
            (Get-ChildItem $dir -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB, 2)

          Write-Host "产物：$($dir.FullName)"
          Write-Host "大小：$totalMb MB"
          Write-Host "版本：$((Get-Item $exe.FullName).VersionInfo.ProductVersion)"

      # 性能基准：只做报告，不阻断构建。
      # 托管 runner 的性能波动较大，硬门禁会产生误报；
      # 待引入"多轮取中位数 + 离散度校验"后再改为阻断式。
      - name: 性能基准（仅报告）
        shell: pwsh
        continue-on-error: true
        run: ./scripts/bench.ps1 -Count 50000 -Rounds 3

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Files-win-x64
          path: artifacts/Files-*-win-x64/**
          if-no-files-found: error
          retention-days: 14
